[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icuflow"
version = "0.1.0"
description = "Leak-safe cohort splitting, calibration and alarm metrics for clinical prediction, in the shape PyHealth and RHealth tasks expect."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Wenke Du"}]
keywords = ["clinical", "icu", "pyhealth", "calibration", "early-warning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
pyhealth = ["pyhealth>=1.1.4"]
dev = ["pytest>=7.0", "scikit-learn>=1.3"]

[project.scripts]
icuflow = "icuflow.cli:main"

[project.urls]
Source = "https://github.com/evelyyyyynnnnn/2.0-Healthcare-Ai-Systems"

[tool.setuptools.packages.find]
include = ["icuflow*"]
